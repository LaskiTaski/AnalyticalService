services:
  # --- Инфраструктура ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bond_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bond_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bond_screener}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bond_user} -d ${POSTGRES_DB:-bond_screener}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Миграции (одноразовый шаг перед стартом приложения) ---
  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: alembic upgrade head
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- Приложение ---
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m backend.api.main
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Бесконечный цикл: сбор с MOEX каждые COLLECTOR_INTERVAL_SECONDS (по умолчанию 300)
    command: python -m backend.collector.main --loop
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DEBUG: "false"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # --- Демо-данные без доступа к MOEX (запуск: docker compose run --rm seed) ---
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m scripts.seed_demo_data
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      migrations:
        condition: service_completed_successfully
    profiles:
      - seed

  # --- Тесты (запуск: docker compose --profile test up test) ---
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: pytest -v --tb=short
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: bond_screener_test
      REDIS_HOST: redis
      REDIS_DB: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - test

volumes:
  pgdata:
